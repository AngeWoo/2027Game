<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>寒修行世界ＧＯ</title>
<!-- link preview (LINE / FB / etc.): title only, no description text -->
<meta property="og:type" content="website">
<meta property="og:title" content="寒修行世界ＧＯ">
<meta property="og:description" content="&#8203;">
<meta name="description" content="&#8203;">
<link rel="stylesheet" href="style.css?v=35">
</head>
<body>

<div class="bg-fx">
  <div class="blob blob-a"></div>
  <div class="blob blob-b"></div>
  <div class="blob blob-c"></div>
  <div class="stars" id="stars"></div>
  <canvas class="snow" id="snow"></canvas>
</div>

<button id="soundToggle" class="sound-toggle" aria-label="切換音效" title="切換音效">
  <span id="soundIcon">🔊</span>
</button>

<header class="page-head">
  <h1><span class="grad-text">寒修行世界ＧＯ</span></h1>
  <p class="subtitle">擲出骰子，走向未知，收下一句屬於你的真如苑歌</p>
</header>

<main class="stage">
  <div class="board-wrap">
    <div id="board" class="board">
      <!-- tiles injected by JS -->
      <div class="center-panel" id="centerPanel">
        <div class="dice-area">
          <div class="dice-tray" id="diceTray" aria-hidden="true"></div>
          <div class="dice-total" id="diceTotal" aria-live="polite">?</div>
          <button id="rollBtn" class="roll-btn">
            <span>擲骰子</span>
          </button>
          <p class="hint">三顆骰子 · 3–18 步</p>
        </div>
      </div>
      <div class="token" id="token">🚀</div>
    </div>
  </div>
</main>

<div class="toast" id="toast"></div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal-card" id="modalCard">
    <div class="modal-place">
      <svg class="modal-plane" viewBox="0 0 72 40" aria-hidden="true">
        <g class="plane-trail" stroke="#bfeaff" stroke-width="2.4" stroke-linecap="round" fill="none">
          <path d="M2 13 H12"/><path d="M0 21 H10"/><path d="M3 29 H13"/>
        </g>
        <g class="plane-body">
          <path d="M22 17 L15 4 H26 L34 16 Z" fill="#35e0ff"/>
          <path d="M20 20 C20 15 26 13 36 13 H58 C66 13 70 17 70 20 C70 23 66 27 58 27 H36 C26 27 20 25 20 20 Z" fill="#fff"/>
          <path d="M38 25 L52 25 L42 38 H33 Z" fill="#a899ff"/>
          <path d="M62 15.2 Q68 16.5 69 20 H62 Z" fill="#35e0ff"/>
          <circle cx="44" cy="20" r="2.2" fill="#35e0ff"/><circle cx="51" cy="20" r="2.2" fill="#35e0ff"/><circle cx="57.5" cy="20" r="2.2" fill="#35e0ff"/>
        </g>
      </svg>
      <span class="modal-place-name" id="modalPlace"></span>
      <svg class="modal-globe" viewBox="0 0 48 48" aria-hidden="true">
        <defs>
          <clipPath id="globe-clip"><circle cx="24" cy="24" r="21"/></clipPath>
          <radialGradient id="globe-ocean" cx="38%" cy="32%" r="75%">
            <stop offset="0" stop-color="#7fdcff"/><stop offset=".6" stop-color="#2f8ff0"/><stop offset="1" stop-color="#1747b8"/>
          </radialGradient>
          <radialGradient id="globe-shade" cx="50%" cy="50%" r="50%">
            <stop offset=".55" stop-color="#001a4d" stop-opacity="0"/><stop offset="1" stop-color="#001a4d" stop-opacity=".55"/>
          </radialGradient>
          <g id="globe-continents">
            <path d="M6 14 C10 9 17 10 20 14 C23 18 19 22 22 27 C24 32 20 38 15 36 C11 34 12 29 9 26 C6 22 3 19 6 14 Z" fill="#5fd38d"/>
            <path d="M28 12 C33 9 40 11 42 16 C44 21 38 23 36 27 C34 31 29 29 28 24 C27 19 25 15 28 12 Z" fill="#7be6a4"/>
            <ellipse cx="31" cy="38" rx="5" ry="2.6" fill="#5fd38d"/>
            <ellipse cx="14" cy="6.5" rx="3.6" ry="1.8" fill="#7be6a4"/>
          </g>
        </defs>
        <circle cx="24" cy="24" r="21" fill="url(#globe-ocean)"/>
        <g clip-path="url(#globe-clip)">
          <g class="globe-land"><use href="#globe-continents"/><use href="#globe-continents" x="48"/></g>
        </g>
        <circle cx="24" cy="24" r="21" fill="url(#globe-shade)"/>
        <ellipse cx="16" cy="14" rx="6" ry="3.2" fill="#fff" opacity=".35" transform="rotate(-30 16 14)"/>
        <circle cx="24" cy="24" r="21" fill="none" stroke="#bfeaff" stroke-opacity=".7" stroke-width="1.2"/>
      </svg>
    </div>
    <div class="modal-icon" id="modalIcon">✨</div>
    <h2 class="modal-name" id="modalName">格子名稱</h2>
    <div class="modal-num" id="modalNum"></div>
    <p class="modal-quote" id="modalQuote">這裡會顯示一句話。</p>
    <button class="modal-close" id="modalClose">繼續前進</button>
  </div>
</div>

<div class="confetti-layer" id="confettiLayer"></div>

<script src="script.js?v=35"></script>
</body>
</html>
