<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>真如世界大冒險·GO</title>
<!-- link preview (LINE / FB / etc.): title only, no description text -->
<meta property="og:type" content="website">
<meta property="og:title" content="真如世界大冒險·GO">
<meta property="og:description" content="&#8203;">
<meta name="description" content="&#8203;">
<meta name="theme-color" content="#fff3e4">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='46' fill='%23e2791f'/%3E%3Ccircle cx='50' cy='50' r='30' fill='%23fff3e4'/%3E%3Ccircle cx='50' cy='50' r='14' fill='%23d1544a'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css?v=59">
</head>
<body>

<div class="bg-fx">
  <div class="blob blob-a"></div>
  <div class="blob blob-b"></div>
  <div class="blob blob-c"></div>
  <div class="stars" id="stars"></div>
  <canvas class="snow" id="snow"></canvas>
</div>

<button id="soundToggle" class="sound-toggle" aria-label="切換音效" title="切換音效">
  <span id="soundIcon">🔊</span>
</button>

<!-- 題庫管理入口：左上角幾乎看不見的小點，碰到才會浮出來 -->
<a class="admin-dot" href="qa-admin.html" title="題庫管理" aria-label="題庫管理">⚙</a>

<header class="page-head">
  <h1><span class="grad-text">真如世界大冒險·GO</span></h1>
  <p class="subtitle">將常住真身的救度慧燈，傳向立教百年</p>
</header>

<main class="stage">
  <div class="board-wrap">
    <div id="board" class="board">
      <!-- tiles injected by JS -->
      <div class="center-panel" id="centerPanel">
        <div class="dice-area">
          <div class="dice-tray" id="diceTray" aria-hidden="true"></div>
          <div class="dice-total" id="diceTotal" aria-live="polite">?</div>
          <button id="rollBtn" class="roll-btn">
            <span>立即出發</span>
          </button>
          <p class="hint">喜羊羊寒修行前進，<span id="hintSteps">？</span>步</p>
          <p class="hint hint-world">寒修行真如苑跨出世界 <span id="worldSteps" aria-live="polite">？</span> 步</p>
          <p class="hint hint-omamori">全球已領受御守 <span id="omamoriCount" class="omamori-count">？</span> 張</p>
        </div>
      </div>
      <div class="token" id="token">🚀</div>
    </div>
  </div>
</main>

<div class="toast" id="toast"></div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal-card" id="modalCard" role="dialog" aria-modal="true" aria-labelledby="modalName" tabindex="-1">
    <div class="modal-place">
      <svg class="modal-plane" viewBox="0 0 72 40" aria-hidden="true">
        <g class="plane-trail" stroke="#e9a35c" stroke-width="2.4" stroke-linecap="round" fill="none">
          <path d="M2 13 H12"/><path d="M0 21 H10"/><path d="M3 29 H13"/>
        </g>
        <g class="plane-body">
          <path d="M22 17 L15 4 H26 L34 16 Z" fill="#f2a155"/>
          <path d="M20 20 C20 15 26 13 36 13 H58 C66 13 70 17 70 20 C70 23 66 27 58 27 H36 C26 27 20 25 20 20 Z" fill="#fff6e8"/>
          <path d="M38 25 L52 25 L42 38 H33 Z" fill="#e2705f"/>
          <path d="M62 15.2 Q68 16.5 69 20 H62 Z" fill="#f2a155"/>
          <circle cx="44" cy="20" r="2.2" fill="#f2a155"/><circle cx="51" cy="20" r="2.2" fill="#f2a155"/><circle cx="57.5" cy="20" r="2.2" fill="#f2a155"/>
          <g class="plane-sheep" transform="translate(51 13) scale(1.6) translate(-48.5 -13)">
            <g class="ps-wool-edge"><ellipse cx="46" cy="10" rx="5.3" ry="3.3"/><circle cx="42" cy="9" r="2.4"/><circle cx="45.6" cy="7.2" r="2.7"/><circle cx="49.6" cy="8.5" r="2.4"/></g>
            <g class="ps-wool"><ellipse cx="46" cy="10" rx="5.3" ry="3.3"/><circle cx="42" cy="9" r="2.4"/><circle cx="45.6" cy="7.2" r="2.7"/><circle cx="49.6" cy="8.5" r="2.4"/></g>
            <g class="ps-ear"><ellipse cx="50" cy="9.5" rx="2.3" ry="1.15" transform="rotate(20 50 9.5)"/></g>
            <g class="ps-ear"><ellipse cx="56.4" cy="9.5" rx="2.3" ry="1.15" transform="rotate(-20 56.4 9.5)"/></g>
            <ellipse class="ps-ear-in" cx="50.3" cy="9.6" rx="1.3" ry=".5" transform="rotate(20 50.3 9.6)"/>
            <ellipse class="ps-ear-in" cx="56.1" cy="9.6" rx="1.3" ry=".5" transform="rotate(-20 56.1 9.6)"/>
            <ellipse class="ps-face" cx="53.2" cy="9.1" rx="3" ry="2.65"/>
            <circle class="ps-tuft" cx="53.2" cy="7" r="1.9"/>
            <ellipse class="ps-cheek" cx="51.2" cy="10.1" rx=".85" ry=".5"/>
            <ellipse class="ps-cheek" cx="55.2" cy="10.1" rx=".85" ry=".5"/>
            <g class="ps-eyes">
              <ellipse cx="51.9" cy="8.9" rx=".66" ry=".87"/><ellipse cx="54.5" cy="8.9" rx=".66" ry=".87"/>
              <circle cx="51.68" cy="8.57" r=".27" fill="#fff"/><circle cx="54.28" cy="8.57" r=".27" fill="#fff"/>
            </g>
            <ellipse class="ps-nose" cx="53.2" cy="10.3" rx=".52" ry=".38"/>
          </g>
        </g>
      </svg>
      <span class="modal-place-name" id="modalPlace"></span>
      <svg class="modal-globe" viewBox="0 0 48 48" aria-hidden="true">
        <defs>
          <clipPath id="globe-clip"><circle cx="24" cy="24" r="21"/></clipPath>
          <radialGradient id="globe-ocean" cx="38%" cy="32%" r="75%">
            <stop offset="0" stop-color="#8ed3e2"/><stop offset=".6" stop-color="#3f93b5"/><stop offset="1" stop-color="#1d5570"/>
          </radialGradient>
          <radialGradient id="globe-shade" cx="50%" cy="50%" r="50%">
            <stop offset=".55" stop-color="#2a1208" stop-opacity="0"/><stop offset="1" stop-color="#2a1208" stop-opacity=".55"/>
          </radialGradient>
          <g id="globe-continents">
            <path d="M6 14 C10 9 17 10 20 14 C23 18 19 22 22 27 C24 32 20 38 15 36 C11 34 12 29 9 26 C6 22 3 19 6 14 Z" fill="#8cc97e"/>
            <path d="M28 12 C33 9 40 11 42 16 C44 21 38 23 36 27 C34 31 29 29 28 24 C27 19 25 15 28 12 Z" fill="#a8d98c"/>
            <ellipse cx="31" cy="38" rx="5" ry="2.6" fill="#8cc97e"/>
            <ellipse cx="14" cy="6.5" rx="3.6" ry="1.8" fill="#a8d98c"/>
          </g>
        </defs>
        <circle cx="24" cy="24" r="21" fill="url(#globe-ocean)"/>
        <g clip-path="url(#globe-clip)">
          <g class="globe-land"><use href="#globe-continents"/><use href="#globe-continents" x="48"/></g>
        </g>
        <circle cx="24" cy="24" r="21" fill="url(#globe-shade)"/>
        <ellipse cx="16" cy="14" rx="6" ry="3.2" fill="#fff6e8" opacity=".35" transform="rotate(-30 16 14)"/>
        <circle cx="24" cy="24" r="21" fill="none" stroke="#b4783c" stroke-opacity=".65" stroke-width="1.2"/>
      </svg>
    </div>
    <div class="modal-icon" id="modalIcon">✨</div>
    <h2 class="modal-name" id="modalName">格子名稱</h2>
    <div class="modal-num" id="modalNum"></div>
    <p class="modal-quote" id="modalQuote">這裡會顯示一句話。</p>
    <button class="modal-close" id="modalClose">繼續前進</button>
  </div>
</div>

<!-- 今日御守：今日實踐視窗按「繼續前進」後，動態抽一張御守 -->
<div class="omamori-overlay" id="omamoriOverlay">
  <div class="omamori-card" id="omamoriCard" role="dialog" aria-modal="true" aria-labelledby="omamoriTag" tabindex="-1">
    <button class="omamori-x" id="omamoriX" aria-label="關閉">×</button>
    <div class="omamori-head">
      <span class="omamori-tag" id="omamoriTag">今日御守</span>
      <span class="omamori-no" id="omamoriNo" aria-live="polite"></span>
    </div>
    <div class="omamori-stage" id="omamoriStage">
      <div class="omamori-wait" aria-hidden="true">
        <span class="omamori-knot"></span>
        <span class="omamori-wait-text">正在為你請一張御守…</span>
      </div>
      <img class="omamori-img" id="omamoriImg" alt="今日御守" decoding="async">
    </div>
    <figure class="omamori-word">
      <span class="omamori-word-sep" aria-hidden="true">&#10070;</span>
      <blockquote class="omamori-word-text" id="omamoriWordText"></blockquote>
      <figcaption class="omamori-word-by" id="omamoriWordBy"></figcaption>
    </figure>
    <p class="omamori-note" id="omamoriNote">願這份守護，伴你把慧燈傳向立教百年。</p>
    <div class="omamori-actions">
      <a class="omamori-save" id="omamoriSave" download aria-live="polite">⤓ 下載圖檔</a>
      <button class="omamori-close" id="omamoriClose">收下御守</button>
    </div>
  </div>
</div>

<div class="confetti-layer" id="confettiLayer"></div>

<script src="omamori-postcard.js?v=2"></script>
<script src="script.js?v=63"></script>
</body>
</html>
