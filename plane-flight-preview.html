<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>小飛機飛向原點 · 動畫草稿</title>
<link rel="stylesheet" href="style.css?v=96">
<style>
  body { margin: 0; padding: 18px 16px 40px; background: var(--bg, #efe7d6); font-family: "PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif; }
  h1 { font-size: 16px; letter-spacing: 2px; margin: 0 0 4px; color: #4a3a2a; }
  .sub { font-size: 12.5px; color: #93826e; margin: 0 0 16px; line-height: 1.7; max-width: 760px; }
  .mock-board { position: relative; display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; max-width: 760px; margin: 0 auto; }
  .mock-tile { aspect-ratio: 5/4; border-radius: 12px; background: rgba(255,253,248,.8); border: 1px solid rgba(120,80,40,.18);
               display: flex; align-items: center; justify-content: center; font-size: 11px; color: #9b8a72; text-align: center; }
  .mock-tile.start { background: linear-gradient(140deg,#ffe6c2,#ffd5a6); border-color: #e3a964; color: #8a5a1e; font-weight: 800; }
  .mock-dialog { position: relative; margin: 18px auto 0; max-width: 420px; padding: 20px; border-radius: 22px; text-align: center;
                 background: linear-gradient(170deg,#fffbf4,#ffeedb); border: 1px solid rgba(120,80,40,.2); box-shadow: 0 16px 34px rgba(90,60,40,.2); }
  .mock-dialog p { margin: 0 0 14px; font-size: 13px; color: #6b5636; }
  .bar { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; max-width: 760px; margin: 18px auto 0; font-size: 12.5px; color: #6b5636; }
  .bar label { display: flex; align-items: center; gap: 6px; }
  input[type=range] { width: 130px; accent-color: #8a5a1e; }
  button { padding: 9px 20px; border: 0; border-radius: 999px; background: #8a5a1e; color: #fff; font-family: inherit; font-size: 13px; cursor: pointer; }
  .hidden-src { position: absolute; width: 0; height: 0; overflow: hidden; }
  /* SVG 是取代元素，光靠 inset:0 不會被撐開（會維持 300x150 的預設大小），
     要明確給 width/height 才蓋得住整個畫面 */
  .path-ghost { position: fixed; left: 0; top: 0; width: 100%; height: 100%; pointer-events: none; z-index: 69; }
</style>
</head>
<body>

<h1>小飛機飛向原點 · 動畫草稿</h1>
<p class="sub">
  按「收下御守」後，小飛機會沿著<b>弧線</b>從視窗飛到左下角的「寒修行原點」，到站縮小淡出並留下一圈光環。<br>
  飛機直接沿用「今日實踐」視窗那隻綿羊小飛機，不另外畫圖。這是提案用的草稿頁，<b>遊戲本身還沒有被接上</b>。
</p>

<div class="mock-board" id="board"></div>

<div class="mock-dialog">
  <p>今日御守</p>
  <button id="takeBtn">收下御守</button>
</div>

<div class="bar">
  <label>弧度 <input type="range" id="arc" min="0" max="60" value="32"><span id="arcVal">0.32</span></label>
  <label>飛行時間 <input type="range" id="dur" min="600" max="3000" step="100" value="1500"><span id="durVal">1500ms</span></label>
  <label><input type="checkbox" id="showPath"> 顯示路徑</label>
  <button id="replay">再播一次</button>
  <button id="ghosts">顯示連續動作</button>
</div>

<!-- 動畫模組會 clone 這一份；正式頁面上「今日實踐」視窗本來就有一份，不用另外加 -->
<div class="hidden-src"><svg class="modal-plane" viewBox="0 0 72 40" aria-hidden="true">
        <g class="plane-trail" stroke="#e9a35c" stroke-width="2.4" stroke-linecap="round" fill="none">
          <path d="M2 13 H12"/><path d="M0 21 H10"/><path d="M3 29 H13"/>
        </g>
        <g class="plane-body">
          <path d="M22 17 L15 4 H26 L34 16 Z" fill="#f2a155"/>
          <path d="M20 20 C20 15 26 13 36 13 H58 C66 13 70 17 70 20 C70 23 66 27 58 27 H36 C26 27 20 25 20 20 Z" fill="#fff6e8"/>
          <path d="M38 25 L52 25 L42 38 H33 Z" fill="#e2705f"/>
          <path d="M62 15.2 Q68 16.5 69 20 H62 Z" fill="#f2a155"/>
          <circle cx="44" cy="20" r="2.2" fill="#f2a155"/><circle cx="51" cy="20" r="2.2" fill="#f2a155"/><circle cx="57.5" cy="20" r="2.2" fill="#f2a155"/>
          <g class="plane-sheep" transform="translate(51 13) scale(1.6) translate(-48.5 -13)">
            <g class="ps-wool-edge"><ellipse cx="46" cy="10" rx="5.3" ry="3.3"/><circle cx="42" cy="9" r="2.4"/><circle cx="45.6" cy="7.2" r="2.7"/><circle cx="49.6" cy="8.5" r="2.4"/></g>
            <g class="ps-wool"><ellipse cx="46" cy="10" rx="5.3" ry="3.3"/><circle cx="42" cy="9" r="2.4"/><circle cx="45.6" cy="7.2" r="2.7"/><circle cx="49.6" cy="8.5" r="2.4"/></g>
            <g class="ps-ear"><ellipse cx="50" cy="9.5" rx="2.3" ry="1.15" transform="rotate(20 50 9.5)"/></g>
            <g class="ps-ear"><ellipse cx="56.4" cy="9.5" rx="2.3" ry="1.15" transform="rotate(-20 56.4 9.5)"/></g>
            <ellipse class="ps-ear-in" cx="50.3" cy="9.6" rx="1.3" ry=".5" transform="rotate(20 50.3 9.6)"/>
            <ellipse class="ps-ear-in" cx="56.1" cy="9.6" rx="1.3" ry=".5" transform="rotate(-20 56.1 9.6)"/>
            <ellipse class="ps-face" cx="53.2" cy="9.1" rx="3" ry="2.65"/>
            <circle class="ps-tuft" cx="53.2" cy="7" r="1.9"/>
            <ellipse class="ps-cheek" cx="51.2" cy="10.1" rx=".85" ry=".5"/>
            <ellipse class="ps-cheek" cx="55.2" cy="10.1" rx=".85" ry=".5"/>
            <g class="ps-eyes">
              <ellipse cx="51.9" cy="8.9" rx=".66" ry=".87"/><ellipse cx="54.5" cy="8.9" rx=".66" ry=".87"/>
              <circle cx="51.68" cy="8.57" r=".27" fill="#fff"/><circle cx="54.28" cy="8.57" r=".27" fill="#fff"/>
            </g>
            <ellipse class="ps-nose" cx="53.2" cy="10.3" rx=".52" ry=".38"/>
          </g>
        </g>
      </svg></div>

<svg class="path-ghost" id="pathGhost" hidden><path id="pathLine" fill="none" stroke="#c8962e" stroke-width="2" stroke-dasharray="6 8"/></svg>

<script src="plane-flight.js?v=3"></script>
<script src="plane-flight-preview.js?v=4"></script>
</body>
</html>
